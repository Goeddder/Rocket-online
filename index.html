<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plutonium Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --bg-grad: radial-gradient(circle at top, #1a1a1e 0%, #050505 100%);
            --card-bg: rgba(30, 30, 35, 0.7);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-main: #ffffff;
            --text-gray: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            background: var(--bg-grad); color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif; margin: 0; padding: 0;
            min-height: 100vh; overflow: hidden;
        }

        .container { 
            padding: 25px 20px 140px 20px; 
            height: 100vh; overflow-y: auto; 
            display: none; 
        }
        .container.active { display: block; }
        
        h2 { font-size: 28px; font-weight: 900; margin-bottom: 25px; letter-spacing: -1px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .card {
            background: var(--card-bg); border-radius: 28px; position: relative; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.05); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            aspect-ratio: 0.9 / 1; cursor: pointer;
        }
        .card:active { transform: scale(0.92); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); 
            padding: 12px; font-size: 11px; font-weight: 800; text-align: center; 
        }

        .profile-card { 
            background: var(--card-bg); backdrop-filter: blur(15px); border-radius: 32px; 
            padding: 40px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .p-avatar { width: 110px; height: 110px; border-radius: 50%; border: 4px solid var(--accent); margin-bottom: 20px; box-shadow: 0 0 20px var(--accent-glow); }

        .sheet { 
            position: fixed; inset: 0; background: var(--bg-grad); z-index: 2000; 
            display: none; padding: 30px; overflow-y: auto;
        }
        .sheet.active { display: block; animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

        .btn-back { display: flex; align-items: center; gap: 8px; color: var(--text-gray); font-weight: 600; margin-bottom: 30px; cursor: pointer; }

        .game-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .mini-icon { width: 80px; height: 80px; border-radius: 22px; border: 2px solid var(--accent); object-fit: cover; }

        .input-group { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 22px; padding: 18px; margin-bottom: 20px; transition: 0.3s;
        }
        .input-group:focus-within { border-color: var(--accent); background: rgba(139, 92, 246, 0.05); }
        .input-group label { display: block; font-size: 10px; color: var(--text-gray); font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
        .input-group input { width: 100%; background: none; border: none; color: white; font-size: 20px; font-weight: 700; }

        .prices-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 30px 0;
        }
        .price-row {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .price-row:active {
            background: var(--accent-glow);
            transform: scale(0.98);
        }
        .price-row.selected {
            background: var(--accent-glow);
            border-color: var(--accent);
        }
        .price-days { font-weight: 900; font-size: 18px; }
        .price-amount { 
            background: var(--accent); 
            padding: 8px 16px; 
            border-radius: 30px; 
            font-weight: 900;
            font-size: 16px;
        }

        .payment-methods {
            display: flex;
            gap: 12px;
            margin: 30px 0;
        }
        .payment-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .payment-btn.active {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
        }
        .payment-btn i { font-size: 28px; }
        .payment-btn span { font-size: 12px; font-weight: 700; }

        .total-price { 
            text-align: center; padding: 30px; background: var(--accent-glow); 
            border-radius: 28px; border: 2px dashed var(--accent); margin-bottom: 30px;
        }
        .btn-pay { 
            background: var(--accent); color: white; border: none; border-radius: 24px; 
            padding: 24px; width: 100%; font-size: 20px; font-weight: 900; 
            box-shadow: 0 15px 30px var(--accent-glow);
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-pay:active { transform: scale(0.95); }

        .nav-bar { 
            position: fixed; bottom: 25px; left: 20px; right: 20px; 
            background: rgba(25, 25, 30, 0.85); backdrop-filter: blur(25px); 
            display: flex; justify-content: space-around; padding: 18px; 
            border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); z-index: 1000; 
        }
        .nav-item { background: none; border: none; color: var(--text-gray); display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.3s; cursor: pointer; }
        .nav-item.active { color: var(--accent); transform: translateY(-5px); }

        .admin-orders { margin-top: 30px; }
        .order-card {
            background: rgba(30, 30, 35, 0.5); border-radius: 20px; padding: 15px;
            margin-bottom: 15px; border-left: 5px solid var(--accent);
        }
        .order-card.pending { border-left-color: var(--yellow); }
        .order-card.approved { border-left-color: var(--green); }
        .order-card.rejected { border-left-color: var(--red); opacity: 0.6; }
        .order-actions { display: flex; gap: 10px; margin-top: 15px; }
        .order-actions button {
            flex: 1; padding: 12px; border: none; border-radius: 15px;
            font-weight: 700; font-size: 13px; cursor: pointer;
        }
        .btn-approve { background: var(--green); color: black; }
        .btn-reject { background: var(--red); color: white; }
        .btn-deliver { background: var(--accent); color: white; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="tab-home" class="container active animate__animated animate__fadeIn">
        <h2>Plutonium Store</h2>
        <div class="grid" id="games-grid"></div>
    </div>

    <div id="tab-history" class="container animate__animated animate__fadeIn">
        <h2>Мої замовлення</h2>
        <div id="history-list"></div>
    </div>

    <div id="tab-profile" class="container animate__animated animate__fadeIn">
        <h2>Профіль</h2>
        <div class="profile-card">
            <img id="u-photo" class="p-avatar" src="https://via.placeholder.com/110">
            <h3 id="u-name" style="font-size: 24px;">Завантаження...</h3>
            <p id="u-id" style="color:var(--text-gray); font-weight: 600;">ID: 00000000</p>
        </div>
    </div>

    <div id="tab-admin" class="container animate__animated animate__fadeIn">
        <h2>Адмін-панель</h2>
        <div class="admin-orders" id="admin-orders"></div>
    </div>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('home', this)"><i data-lucide="layout-grid"></i><span>Магазин</span></button>
        <button class="nav-item" onclick="switchTab('history', this)"><i data-lucide="receipt"></i><span>Історія</span></button>
        <button class="nav-item" onclick="switchTab('profile', this)"><i data-lucide="user"></i><span>Профіль</span></button>
    </nav>
</div>

<div id="pay-sheet" class="sheet">
    <div class="btn-back" onclick="closeSheet()"><i data-lucide="arrow-left"></i> ПОВЕРНУТИСЯ</div>
    
    <div class="game-header">
        <img id="g-icon" class="mini-icon" src="">
        <div>
            <h1 id="g-name" style="margin:0; font-size:32px; font-weight:900;">Game</h1>
            <div style="color:var(--green); font-weight:800;">Виберіть період:</div>
        </div>
    </div>

    <div class="input-group">
        <label>Ігровий нікнейм</label>
        <input type="text" id="p-tag" placeholder="Ваш нікнейм">
    </div>

    <div id="price-list" class="prices-grid"></div>

    <div class="payment-methods" id="payment-methods">
        <div class="payment-btn active" onclick="selectPayment('card')" id="pay-card">
            <i data-lucide="credit-card"></i>
            <span>Картка</span>
        </div>
        <div class="payment-btn" onclick="selectPayment('crypto')" id="pay-crypto">
            <i data-lucide="bitcoin"></i>
            <span>CryptoBot</span>
        </div>
    </div>

    <div class="total-price">
        <div style="font-size:12px; color:var(--text-gray); margin-bottom:10px; font-weight:800;">ДО ОПЛАТИ</div>
        <span style="font-size:42px; font-weight:950;" id="total-price">0</span> <span style="font-size:24px; font-weight:700;" id="currency">грн</span>
    </div>

    <button class="btn-pay animate__animated animate__pulse animate__infinite" onclick="sendOrder()" id="pay-btn">ОПЛАТИТИ</button>
    <div style="height: 50px;"></div>
</div>

<!-- ЕКРАН ВИДАЧІ ТОВАРУ -->
<div id="delivery-sheet" class="sheet">
    <div class="btn-back" onclick="closeDeliverySheet()"><i data-lucide="arrow-left"></i> НАЗАД</div>
    
    <h2 style="margin-bottom: 20px;">Видача товару</h2>
    
    <div class="input-group">
        <label>ID ЗАМОВЛЕННЯ</label>
        <input type="text" id="delivery-order-id" readonly>
    </div>
    
    <div class="input-group">
        <label>ІНФОРМАЦІЯ ПРО КЛІЄНТА</label>
        <div id="delivery-client-info" style="color: var(--text-gray); font-size: 14px; padding: 10px 0;"></div>
    </div>
    
    <div class="input-group">
        <label>ФАЙЛ (file_id)</label>
        <input type="text" id="delivery-file" placeholder="Введіть file_id">
    </div>
    
    <div class="input-group">
        <label>КЛЮЧ АКТИВАЦІЇ</label>
        <input type="text" id="delivery-key" placeholder="Введіть ключ">
    </div>
    
    <button class="btn-pay" onclick="sendDelivery()" style="margin-top: 20px;">✅ ВІДПРАВИТИ КЛІЄНТУ</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand(); 
    
    const BOT_TOKEN = "8522948833:AAFPgQz77GDY2YafZRtNMM9ilcxZ65_2wus";
    const ADMIN_ID = 1471307057;
    const CARD_NUMBER = "4441111008011946";
    const CRYPTO_TOKEN = "466345:AADMm3mzlC6KGJmwt3r771bUPIx40CMEKhQ";
    const CRYPTO_API = "https://pay.crypt.bot/api";

    const user = tg.initDataUnsafe?.user || { id: 777, first_name: "Гість" };
    const isAdmin = user.id === ADMIN_ID;

    const cheats = [
        {
            id: 'plutonium',
            name: '🦾 Plutonium',
            game: 'Standoff 2',
            icon: 'https://files.catbox.moe/eqco0i.png',
            prices: {
                '7': { uah: 150, usd: 3.5 },
                '30': { uah: 300, usd: 7 },
                '90': { uah: 700, usd: 16.5 }
            }
        },
        {
            id: 'zolo',
            name: '🔥 Zolo Cheat',
            game: 'PUBG Mobile',
            icon: 'https://files.catbox.moe/opz3nu.png',
            prices: {
                '1': 85, '3': 180, '7': 325, '14': 400, '30': 690, '60': 1000
            }
        },
        {
            id: 'impact',
            name: '⚡ Impact VIP',
            game: 'PUBG Mobile',
            icon: 'https://files.catbox.moe/9ztxkj.png',
            prices: {
                '1': 115, '7': 480, '30': 1170
            }
        },
        {
            id: 'king',
            name: '👑 King Mod',
            game: 'PUBG Mobile',
            icon: 'https://files.catbox.moe/vyhlec.png',
            prices: {
                '1': 100, '7': 425, '30': 1060
            }
        },
        {
            id: 'inferno',
            name: '💥 Inferno Cheat',
            game: 'PUBG Mobile',
            icon: 'https://files.catbox.moe/5vtpq1.png',
            prices: {
                '1': 80, '3': 200, '7': 350, '15': 530, '30': 690, '60': 950
            }
        },
        {
            id: 'zolo_cis',
            name: '🎮 Zolo CIS',
            game: 'PUBG Mobile',
            icon: 'https://files.catbox.moe/deicc2.png',
            prices: {
                '1': 70, '3': 150, '7': 250, '14': 350, '30': 700, '60': 900
            }
        }
    ];

    let currentCheat = null;
    let selectedDays = null;
    let paymentMethod = 'card';

    // Профіль
    document.getElementById('u-name').innerText = user.first_name;
    document.getElementById('u-id').innerText = 'ID: ' + user.id;
    if(user.photo_url) document.getElementById('u-photo').src = user.photo_url;

    // Додаємо кнопку адміна якщо треба
    if(isAdmin) {
        const navBar = document.querySelector('.nav-bar');
        const adminBtn = document.createElement('button');
        adminBtn.className = 'nav-item';
        adminBtn.setAttribute('onclick', "switchTab('admin', this)");
        adminBtn.innerHTML = '<i data-lucide="shield"></i><span>Адмін</span>';
        navBar.appendChild(adminBtn);
    }

    function loadGames() {
        const grid = document.getElementById('games-grid');
        grid.innerHTML = '';
        cheats.forEach(cheat => {
            const card = document.createElement('div');
            card.className = 'card animate__animated animate__backInUp';
            card.setAttribute('onclick', `openCheat('${cheat.id}')`);
            card.innerHTML = `
                <img src="${cheat.icon}" onerror="this.src='https://img.icons8.com/color/512/game.png'">
                <div class="card-info">${cheat.name}</div>
            `;
            grid.appendChild(card);
        });
        lucide.createIcons();
    }

    function switchTab(tab, el) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        if(tab === 'history') renderHistory();
        if(tab === 'admin' && isAdmin) renderAdminOrders();
        tg.HapticFeedback.impactOccurred('medium');
    }

    function openCheat(cheatId) {
        currentCheat = cheats.find(c => c.id === cheatId);
        selectedDays = null;
        
        document.getElementById('g-name').innerText = currentCheat.name;
        document.getElementById('g-icon').src = currentCheat.icon;
        
        renderPrices();
        
        document.getElementById('pay-sheet').style.display = 'block';
        document.getElementById('pay-sheet').classList.add('active');
    }

    function renderPrices() {
        const priceList = document.getElementById('price-list');
        priceList.innerHTML = '';
        
        for(const [days, price] of Object.entries(currentCheat.prices)) {
            const row = document.createElement('div');
            row.className = 'price-row';
            row.setAttribute('onclick', `selectDays('${days}')`);
            
            let priceText = '';
            if(currentCheat.id === 'plutonium') {
                priceText = `${price.uah} грн / ${price.usd}$`;
            } else {
                priceText = `${price} грн`;
            }
            
            row.innerHTML = `
                <span class="price-days">${days} дн.</span>
                <span class="price-amount">${priceText}</span>
            `;
            priceList.appendChild(row);
        }
    }

    function selectDays(days) {
        selectedDays = days;
        document.querySelectorAll('.price-row').forEach(r => r.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
        updateTotal();
    }

    function selectPayment(method) {
        paymentMethod = method;
        document.getElementById('pay-card').classList.toggle('active', method === 'card');
        document.getElementById('pay-crypto').classList.toggle('active', method === 'crypto');
        
        const currency = method === 'card' ? 'грн' : '$';
        document.getElementById('currency').innerText = currency;
        updateTotal();
    }

    function updateTotal() {
        if(!selectedDays || !currentCheat) return;
        
        const price = currentCheat.prices[selectedDays];
        let total = 0;
        
        if(currentCheat.id === 'plutonium') {
            total = paymentMethod === 'card' ? price.uah : price.usd;
        } else {
            total = price;
        }
        
        document.getElementById('total-price').innerText = total;
    }

    function closeSheet() { 
        document.getElementById('pay-sheet').classList.remove('active');
        setTimeout(() => { document.getElementById('pay-sheet').style.display = 'none'; }, 400);
    }

    function closeDeliverySheet() {
        document.getElementById('delivery-sheet').classList.remove('active');
        setTimeout(() => { document.getElementById('delivery-sheet').style.display = 'none'; }, 400);
    }

    async function createCryptoInvoice() {
        if(!selectedDays || !currentCheat) return;
        
        const amount = currentCheat.id === 'plutonium' 
            ? currentCheat.prices[selectedDays].usd
            : currentCheat.prices[selectedDays];
        
        const tag = document.getElementById('p-tag').value.trim();
        if(!tag) return tg.showAlert("Введіть ваш нікнейм!");
        
        const orderId = 'ORD' + Date.now().toString().slice(-8);
        
        try {
            const response = await fetch(`${CRYPTO_API}/createInvoice`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Crypto-Pay-API-Token': CRYPTO_TOKEN
                },
                body: JSON.stringify({
                    asset: 'USDT',
                    amount: amount,
                    description: `${currentCheat.name} - ${selectedDays} днів`,
                    paid_btn_name: 'openBot',
                    paid_btn_url: `https://t.me/PlutoniumfilesBot`,
                    payload: `${user.id}|${selectedDays}|${currentCheat.id}`
                })
            });
            
            const data = await response.json();
            
            if(data.ok && data.result) {
                const invoice = data.result;
                
                const order = {
                    id: orderId,
                    cheat: currentCheat.name,
                    cheatId: currentCheat.id,
                    days: selectedDays,
                    price: amount,
                    currency: 'USD',
                    tag: tag,
                    status: 'pending',
                    userId: user.id,
                    userName: user.first_name,
                    paymentMethod: 'crypto',
                    invoiceId: invoice.invoice_id,
                    timestamp: new Date().toISOString()
                };

                let history = JSON.parse(localStorage.getItem('plutonium_orders') || '[]');
                history.push(order);
                localStorage.setItem('plutonium_orders', JSON.stringify(history));

                tg.openLink(invoice.pay_url);
                
                const msg = `🆕 *КРИПТО-ЗАМОВЛЕННЯ #${orderId}*\n\n` +
                    `👤 Клієнт: ${user.first_name} (ID: ${user.id})\n` +
                    `🎮 Чит: ${currentCheat.name}\n` +
                    `📅 Період: ${selectedDays} дн.\n` +
                    `🆔 Нік: \`${tag}\`\n` +
                    `💰 Сума: ${amount} USDT\n` +
                    `💳 Спосіб: CryptoBot`;

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: "Markdown" })
                });
                
                tg.showAlert(`✅ Замовлення #${orderId} створено! Перейдіть за посиланням для оплати.`);
                closeSheet();
            } else {
                tg.showAlert("Помилка створення рахунку. Спробуйте пізніше.");
            }
        } catch (error) {
            console.error('CryptoBot error:', error);
            tg.showAlert("Помилка з'єднання з CryptoBot");
        }
    }

    async function sendOrder() {
        if(paymentMethod === 'crypto') {
            await createCryptoInvoice();
            return;
        }
        
        const tag = document.getElementById('p-tag').value.trim();
        if(!tag) return tg.showAlert("Введіть ваш нікнейм!");
        if(!selectedDays) return tg.showAlert("Виберіть період!");

        const price = currentCheat.prices[selectedDays];
        const total = currentCheat.id === 'plutonium' ? price.uah : price;

        const orderId = 'ORD' + Date.now().toString().slice(-8);
        const order = {
            id: orderId,
            cheat: currentCheat.name,
            cheatId: currentCheat.id,
            days: selectedDays,
            price: total,
            currency: 'UAH',
            tag: tag,
            status: 'pending',
            userId: user.id,
            userName: user.first_name,
            paymentMethod: 'card',
            timestamp: new Date().toISOString()
        };

        let history = JSON.parse(localStorage.getItem('plutonium_orders') || '[]');
        history.push(order);
        localStorage.setItem('plutonium_orders', JSON.stringify(history));

        const msg = `🆕 *ЗАМОВЛЕННЯ #${orderId}*\n\n` +
            `👤 Клієнт: ${user.first_name} (ID: ${user.id})\n` +
            `🎮 Чит: ${currentCheat.name}\n` +
            `📅 Період: ${selectedDays} дн.\n` +
            `🆔 Нік: \`${tag}\`\n` +
            `💰 Сума: ${total} грн\n` +
            `💳 Спосіб: Банківська картка`;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: ADMIN_ID, text: msg, parse_mode: "Markdown" })
        });

        tg.openLink(`https://send.monobank.ua/jar/7bpLBmtzoA?a=${total * 100}`);
        tg.showAlert(`✅ Замовлення #${orderId} створено!\nКартка: ${CARD_NUMBER}\nКоментар: За цифрові товари`);

        closeSheet();
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        const orders = JSON.parse(localStorage.getItem('plutonium_orders') || '[]')
            .filter(o => o.userId === user.id)
            .reverse();

        if(!orders.length) { 
            list.innerHTML = '<p style="text-align:center; color:gray; margin-top:50px;">У вас ще немає замовлень</p>'; 
            return; 
        }
        
        list.innerHTML = orders.map(o => {
            const statusColor = o.status === 'approved' ? 'var(--green)' : 
                              o.status === 'rejected' ? 'var(--red)' : 'var(--yellow)';
            const statusText = o.status === 'approved' ? '✅ Підтверджено' : 
                             o.status === 'rejected' ? '❌ Відхилено' : '⏳ В обробці';
            
            return `
                <div class="input-group animate__animated animate__fadeInUp" style="border-left:5px solid ${statusColor}">
                    <div style="display:flex; justify-content:space-between;">
                        <b>${o.cheat}</b> 
                        <span style="color:${statusColor}; font-size:10px; font-weight:900;">${statusText}</span>
                    </div>
                    <div style="font-size:12px; margin-top:5px; color:var(--text-gray)">
                        ${o.days} дн. • ${o.price} ${o.currency} • ${o.tag}<br>
                        ID: ${o.id}
                    </div>
                </div>
            `;
        }).join('');
    }

    function openDeliverySheet(order) {
        document.getElementById('delivery-order-id').value = order.id;
        document.getElementById('delivery-client-info').innerHTML = 
            `👤 ${order.userName} (ID: ${order.userId})<br>` +
            `🎮 ${order.cheat} - ${order.days} дн.<br>` +
            `🆔 ${order.tag}`;
        document.getElementById('delivery-sheet').style.display = 'block';
        document.getElementById('delivery-sheet').classList.add('active');
    }

    async function sendDelivery() {
        const orderId = document.getElementById('delivery-order-id').value;
        const fileId = document.getElementById('delivery-file').value.trim();
        const key = document.getElementById('delivery-key').value.trim();
        
        if(!fileId || !key) return tg.showAlert("Введіть файл і ключ!");

        let orders = JSON.parse(localStorage.getItem('plutonium_orders') || '[]');
        const orderIndex = orders.findIndex(o => o.id === orderId);
        
        if(orderIndex === -1) return tg.showAlert("Замовлення не знайдено!");

        const order = orders[orderIndex];
        
        // Відправляємо файл
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                chat_id: order.userId, 
                document: fileId,
                caption: `🔑 *КЛЮЧ АКТИВАЦІЇ:* \`${key}\``,
                parse_mode: "Markdown"
            })
        });

        // Відправляємо повідомлення
        const userMsg = `✅ *ВАШЕ ЗАМОВЛЕННЯ #${orderId} ГОТОВЕ!*\n\n` +
            `🎮 Чит: ${order.cheat}\n` +
            `📅 Період: ${order.days} дн.\n` +
            `🔑 Ключ: \`${key}\`\n\n` +
            `Дякуємо за покупку в Plutonium Store! ❤️`;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                chat_id: order.userId, 
                text: userMsg, 
                parse_mode: "Markdown" 
            })
        });

        order.status = 'approved';
        orders[orderIndex] = order;
        localStorage.setItem('plutonium_orders', JSON.stringify(orders));

        document.getElementById('delivery-file').value = '';
        document.getElementById('delivery-key').value = '';
        
        tg.showAlert("✅ Товар відправлено клієнту!");
        closeDeliverySheet();
        renderAdminOrders();
    }

    function renderAdminOrders() {
        const list = document.getElementById('admin-orders');
        const orders = JSON.parse(localStorage.getItem('plutonium_orders') || '[]').reverse();

        if(!orders.length) { 
            list.innerHTML = '<p style="text-align:center; color:gray; margin-top:50px;">Немає замовлень</p>'; 
            return; 
        }
        
        list.innerHTML = orders.map((o, idx) => {
            const statusClass = o.status === 'approved' ? 'approved' : 
                              o.status === 'rejected' ? 'rejected' : 'pending';
            const statusText = o.status === 'approved' ? '✅ Підтверджено' : 
                             o.status === 'rejected' ? '❌ Відхилено' : '⏳ Очікує';
            
            return `
                <div class="order-card ${statusClass}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <b>${o.cheat}</b>
                        <span style="font-size:12px;">${o.id}</span>
                    </div>
                    <div style="font-size:13px; margin-bottom:10px;">
                        👤 ${o.userName} (ID: ${o.userId})<br>
                        📅 ${o.days} дн. • 💰 ${o.price} ${o.currency}<br>
                        🆔 ${o.tag}<br>
                        💳 ${o.paymentMethod === 'card' ? 'Картка' : 'CryptoBot'}<br>
                        📊 ${statusText}
                    </div>
                    ${o.status === 'pending' ? `
                        <div class="order-actions">
                            <button class="btn-deliver" onclick='openDeliverySheet(${JSON.stringify(o).replace(/'/g, "\\'")})'>📦 ВИДАТИ ТОВАР</button>
                            <button class="btn-reject" onclick="rejectOrder('${o.id}')">❌ ВІДХИЛИТИ</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }

    async function rejectOrder(orderId) {
        let orders = JSON.parse(localStorage.getItem('plutonium_orders') || '[]');
        const orderIndex = orders.findIndex(o => o.id === orderId);
        
        if(orderIndex === -1) return;
        
        orders[orderIndex].status = 'rejected';
        localStorage.setItem('plutonium_orders', JSON.stringify(orders));
        
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                chat_id: orders[orderIndex].userId, 
                text: `❌ *ЗАМОВЛЕННЯ #${orderId} ВІДХИЛЕНО*\n\nПлатіж не знайдено. Спробуйте ще раз.`,
                parse_mode: "Markdown" 
            })
        });
        
        renderAdminOrders();
        tg.HapticFeedback.notificationOccurred('error');
    }

    loadGames();
    lucide.createIcons();
</script>
</body>
</html>
